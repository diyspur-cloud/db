name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Project ref exato a que o deploy autorizado se destina"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SQL parser
        run: python -m pip install --disable-pip-version-check pglast
      - name: Parse all SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = sorted(Path("supabase/migrations").rglob("*.sql"))
          for path in files:
              parse_sql(path.read_text())
          print(f"Parsed {len(files)} SQL files")
          PY
      - name: Run database smoke tests
        run: |
          npm ci --prefix scripts/security-smoke
          npm test --prefix scripts/security-smoke
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate generated types and function sources
        run: |
          deno check src/lib/supabase/database.types.ts
          deno task --config supabase/functions/deno.json check
          deno task --config supabase/functions/deno.json lint
          deno task --config supabase/functions/deno.json fmt:check
          deno task --config scripts/integration-smoke/deno.json check
          deno task --config scripts/integration-smoke/deno.json lint
          deno task --config scripts/integration-smoke/deno.json fmt:check
          git diff --check

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the requested project ref and deployment credentials
        env:
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing GitHub repository variable SUPABASE_PROJECT_REF"; exit 1; }
          test "$CONFIRM_PROJECT_REF" = "$SUPABASE_PROJECT_REF" || { echo "The typed confirmation ref does not match SUPABASE_PROJECT_REF"; exit 1; }
      - name: Verify runtime secrets exist in Supabase without printing values
        run: |
          npx --yes supabase@2.120.0 secrets list --project-ref "$SUPABASE_PROJECT_REF" > /tmp/supabase-secrets.txt
          for name in OPENAI_API_KEY RESEND_API_KEY RESEND_FROM_EMAIL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SCHEDULED_REMINDERS_SECRET; do
            if ! grep -q "^$name[[:space:]]" /tmp/supabase-secrets.txt; then
              echo "Required Supabase runtime secret is not configured: $name"
              exit 1
            fi
          done
          rm -f /tmp/supabase-secrets.txt
      - name: Deploy all reviewed Edge Functions
        run: |
          for function in \
            award-xp vote-next-book scheduled-reminders ai-recommendations \
            ai-user-embeddings match-readers newsletter-dispatch stripe-webhook \
            social-render-card quiz-validate generate-book-embeddings; do
            npx --yes supabase@2.120.0 functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF"
          done
